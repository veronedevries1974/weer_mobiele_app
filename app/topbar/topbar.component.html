<header class="top-bar-wrapper">
  <div class="logo">
    <h2>
      <span class="app-icon">🌤️</span> WeerApp 
      <span *ngIf="cityName$ | async as city" class="current-location">- {{ city }}</span>
    </h2>
  </div>

  <form #searchForm="ngForm" (ngSubmit)="searchForm.valid && search(searchForm)" novalidate>
    <div class="form-layout">
      
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Zoek een locatie</mat-label>
        <input 
          matInput 
          id="locationInput"
          name="location" 
          [(ngModel)]="loc" 
          required 
          autocomplete="off"
          placeholder="bijv. Amsterdam, Parijs" 
          title="Invoerveld voor het zoeken naar een stad of locatie" />
      </mat-form-field>
      
      <button 
        mat-flat-button 
        type="submit" 
        class="search-button" 
        [disabled]="searchForm.invalid">
        Zoeken
      </button>
      
    </div>
  </form>
</header>
