<header class="top-bar-wrapper">
  <!-- Logo sectie met de actieve stadsnaam -->
  <div class="logo">
    <!-- GEFIXED: cityName() vervangen door cityName$ | async -->
    <h2>🌤️ WeerApp <span *ngIf="cityName$ | async as city">- {{ city }}</span></h2>
  </div>

  <!-- Zoekformulier met Angular Material styling -->
  <form #searchForm="ngForm" (ngSubmit)="search(searchForm)" novalidate>
    <div class="form-layout">
      
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Zoek een locatie</mat-label>
        <input 
          matInput 
          id="locationInput"
          title="Invoerveld voor het zoeken naar een stad of locatie"
          name="locationInput" 
          [(ngModel)]="loc" 
          [ngModelOptions]="{standalone: true}"
          required 
          autocomplete="off" />
      </mat-form-field>
      
      <button 
        mat-flat-button 
        type="submit" 
        class="search-button" 
        [disabled]="searchForm.invalid">
        Zoeken
      </button>

    </div>
  </form>
</header>
