  <div class="main-container"> 
  
  <!-- Welkomscherm (wanneer er nog GEEN stad is gekozen/gezocht) -->
  <div *ngIf="!cityName()" class="welcome-section"> 
    <mat-card>
      <mat-card-content class="welcome-content">
        <h1>🌤️ Welkom bij de WeerApp</h1>
        <p>Voer hierboven in de balk een locatie in om de weersinformatie te starten.</p>
      </mat-card-content>
    </mat-card>
  </div> 

  <!-- Dashboard Container (wanneer er WEL een stad is gekozen) -->
  <div *ngIf="cityName()">
    <header class="location-header">
      <h1>Weer Dashboard voor {{ cityName() }}</h1>
    </header>

    <!-- GECORRIGEERD: Ionic Segment Schakelaar gekoppeld aan de actieve router-status -->
    <ion-segment [value]="activeTab">
      <ion-segment-button value="child1" routerLink="child1">
        <ion-label>Huidig</ion-label>
      </ion-segment-button>
      <ion-segment-button value="child2" routerLink="child2">
        <ion-label>Toekomst</ion-label>
      </ion-segment-button>
      <ion-segment-button value="child3" routerLink="child3">
        <ion-label>UV-Score</ion-label>
      </ion-segment-button>
    </ion-segment>

    <!-- Dynamische subpagina-outlet (Hier landen Child1, Child2 en Child3) -->
    <main class="sub-page-outlet">
      <!-- CRUCIAAL: Deze ion-router-outlet laadt de daadwerkelijke weerpagina's in -->
      <ion-router-outlet></ion-router-outlet>
    </main>

    <!-- Extra info card onderaan (gebaseerd op je .signals-card styling) -->
    <mat-card class="signals-card">
      <mat-card-content class="signals-content">
        <h2>Live updates voor <strong>{{ cityName() }}</strong></h2>
        <p class="placeholder-text">Gegevens worden direct verwerkt via NgRx Signals</p>
        <hr />
        <div class="badge-container">
          <button class="custom-badge-btn badge-success">Verversen</button>
          <button class="custom-badge-btn badge-warning">Favoriet ⭐</button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

</div>
