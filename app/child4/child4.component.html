<div class="child-container">

  <!-- 1. Kaart voor het allerlaatste binnengekomen signaal -->
  <mat-card *ngIf="laatsteBericht()" class="latest-signal-card">
    <mat-card-content class="latest-signal-content">
      <p>
        <strong>Laatste signaal:</strong> 
        <span class="signal-highlight">"{{ laatsteBericht() }}"</span>
      </p>
    </mat-card-content>
  </mat-card>

  <!-- 2. Kaart voor de totale verzamelde lijst -->
  <mat-card class="list-card">
    <mat-card-header>
      <mat-card-title>Ontvangen Berichtenlijst</mat-card-title>
    </mat-card-header>

    <mat-card-content class="list-card-content">
      
      <!-- Placeholder tonen wanneer de lijst leeg is -->
      <div *ngIf="berichtenLijst().length === 0" class="empty-list-text">
        Nog geen berichten in de centrale lijst. Typ iets in Child 1, 2 of 3!
      </div>

      <!-- Berichtenlijst tabel -->
      <table class="weather-table" *ngIf="berichtenLijst().length !== 0">
        <tbody>
          <!-- GEFIXED: Strikte typesyntaxis voor de herhaling van het Signal -->
          <tr *ngFor="let bericht of berichtenLijst(); let i = index">
            <td class="signal-text">
              {{ bericht }}
            </td>
            <td class="action-cell">
              <!-- Material Flat Button om specifiek de unieke index te wissen -->
              <button 
                mat-flat-button 
                color="warn" 
                (click)="verwijderBericht(i)" 
                class="delete-button">
                Verwijder
              </button>
            </td>
          </tr>
        </tbody>
      </table>

    </mat-card-content>
  </mat-card>

  <!-- 3. Invoersectie -->
  <mat-card class="input-card">
    <mat-card-header>
      <mat-card-title>Nieuw bericht toevoegen</mat-card-title>
    </mat-card-header>
    
    <mat-card-content class="form-card-content">
      <mat-form-field appearance="outline">
        <mat-label>Invoer voor Child Service</mat-label>
        <input 
          matInput 
          id="c4Input"
          title="Bericht invoerveld voor Child 4"
          name="c4Input"
          [(ngModel)]="ChildInvoerModel" 
          [ngModelOptions]="{standalone: true}"
          placeholder="Typ iets..."
          (keyup.enter)="onChildInvoer()">
      </mat-form-field>
      
      <button 
        mat-raised-button 
        color="primary"
        (click)="onChildInvoer()"
        [disabled]="!ChildInvoerModel.trim()">
        Versturen
      </button>
    </mat-card-content>
  </mat-card>
</div>
